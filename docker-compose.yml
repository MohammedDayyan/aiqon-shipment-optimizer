version: '3.8'

services:
  api:
    build: .
    container_name: aiqon_optimizer_api
    ports:
      - "8000:8000"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    restart: always

  ui:
    build: .
    container_name: aiqon_optimizer_ui
    ports:
      - "8501:8501"
    command: streamlit run UI/app.py --server.address=0.0.0.0 --server.port=8501
    depends_on:
      - api
    restart: always